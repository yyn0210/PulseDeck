[package]
name = "pulse-deck"
version = "0.1.0"
description = "Windows 系统监控小工具（CPU / 内存 / 硬盘 / 电池 / 充电功率 / GPU / 网络 / 温度）"
edition = "2021"

[lib]
name = "pulse_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
] }
nvml-wrapper = "0.13"
tauri-plugin-autostart = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_Wmi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Security", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }
webview2-com = "0.39"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
incremental = false
strip = true
