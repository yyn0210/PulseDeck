[package]
name = "pulse-deck"
version = "0.10.0"
description = "Windows 系统监控小工具（CPU / 内存 / 硬盘 / 电池 / 充电功率 / GPU / 网络 / 温度）"
edition = "2021"

[lib]
name = "pulse_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
# NVML 绑定：Windows 与 Linux 共用（platform/gpu_nvml.rs），动态加载各平台的 NVML 库。
# 非 NVIDIA 环境初始化失败 —— 属设计内的降级路径。
nvml-wrapper = "0.13"
tauri-plugin-autostart = "2"
# 单实例：第二次启动只把已有实例的主窗口拉到前台，避免两个托盘图标 / 两只宠物，
# 以及两个实例对 pet.json、fan.json 的「后写覆盖」互相踩
tauri-plugin-single-instance = "2"
# BLE GATT 服务端（数据推送的蓝牙通道，push/ble.rs）：Windows 走 WinRT
# GattServiceProvider、Linux 走 bluer(BlueZ D-Bus)，一套 API 两平台。
# （btleplug 只有 central 角色，做不了服务端，别换回去。）
# tokio / uuid 是它的直接需求；tauri 本身已在依赖树里带 tokio，不构成新增负担。
ble-peripheral-rust = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = "1"
# WebSocket 服务端（数据推送 TCP 通道的浏览器接入，push/ws.rs）：同步库贴合
# worker 的裸线程模型；默认 feature 即含握手，ws:// 不需要 TLS。
tungstenite = "0.30"

# Windows 专属依赖（PDH / WMI-COM 绑定、两个挂件窗口的 WebView2 复用）。
# 采样层的 OS 绑定代码已全部 cfg 门控（见 src/platform/），依赖随之分区；
# 将来加各平台打包依赖时在对应的 [target.'cfg(...)'.dependencies] 里追加。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  # GPU 兜底通道（gpu.rs）的适配器身份：PDH 只给 LUID，名字与显存总量要向 DXGI 要
  "Win32_Graphics_Dxgi",
  "Win32_System_Wmi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  # 任务栏挂件（taskbar.rs）：找任务栏 / 通知区域窗口、读前台窗口、重新置顶
  "Win32_UI_WindowsAndMessaging",
  # 任务栏配色（SystemUsesLightTheme）取自注册表
  "Win32_System_Registry",
] }
webview2-com = "0.39"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
incremental = false
strip = true
