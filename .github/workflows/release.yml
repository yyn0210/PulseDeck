# Release：推送 v* 标签时打包 Windows NSIS 安装包 + Linux deb/AppImage，
# 并自动创建 GitHub Release
#
# 用法：
#   1. 同步版本号（package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml，
#      workflow 会校验 tag 与 tauri.conf.json 一致，不一致直接失败）
#   2. git tag v0.x.y && git push origin v0.x.y
#
# 安装包文件名里的版本号来自 tauri.conf.json 的 version 字段。
# 打包目标按平台拆在 tauri.windows.conf.json（nsis + PawnIO 资源）与
# tauri.linux.conf.json（deb + AppImage，不带 Windows 专属资源）里。
# Linux job 依赖 Windows job（needs）：版本校验在 Windows job 里先跑，
# 也避免两个 job 并发创建同一个 Release 互相竞争。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows 打包并发布
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable, msvc）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22（Vite 7 要求 ≥ 20.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 与 CI 一致：npm ci + package-lock.json，保证打版用的依赖树可复现
      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($conf -ne $tag) {
            Write-Error "tag (v$tag) 与 tauri.conf.json 的 version ($conf) 不一致，请先同步版本号再打标签"
          }

      # 出正式包之前再跑一遍单测，防止带着回归打版（Cargo.toml 在 src-tauri/ 下）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # tauri-action 会执行 tauri build（含 beforeBuildCommand），出 NSIS 安装包
      # 并上传到 GitHub Release，不会走裸 cargo build
      - name: 构建 NSIS 安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 安装包（NSIS）：下载 `PulseDeck_0.9.0_x64-setup.exe` 双击安装即可，
            无需联网、无需管理员权限。

            Linux x64：deb 系发行版（Debian / Ubuntu / Deepin / UOS）下载 `PulseDeck_0.9.0_amd64.deb`，
            执行 `sudo apt install ./PulseDeck_0.9.0_amd64.deb`；其他发行版下载
            `PulseDeck_0.9.0_amd64.AppImage`，`chmod +x` 后直接运行。
            Linux 上无需提权（温度 / 风扇走 hwmon）。

            ## 本版更新（${{ github.ref_name }}）

            本版给监控数据加了一条新出口——**数据推送**，另把 CPU 主频的读数口径补正了。

            - **数据推送（新功能）**：把监控指标按独立间隔推给外部设备当「第二屏」——DIY 小屏（ESP32 等）、
              手机 / 平板、树莓派状态屏都能接。局域网 TCP 与蓝牙 BLE 两条通道，推同一份紧凑 JSON：
              - **TCP 通道**：同一端口（默认 17432）同时接待裸 TCP 与 **WebSocket** —— 浏览器 / 手机网页
                直接连上就能用，不需要原生 App；连上立即先收一拍数据，推不过来的慢客户端会被自动剔除。
              - **蓝牙通道**：BLE 串口（Nordic UART Service，广播名 `PulseDeck`），手机 App 按 NUS 接入即可
                （Linux 上走系统 BlueZ，桌面发行版一般自带）。
              - 设置页「数据推送」里勾选要推的指标组（CPU / 内存 / GPU / 电池 / 网络 / 磁盘）、
                自选节拍（300 ms ~ 10 s）；**单向只读**，设备无法向电脑发送任何指令。
              - 字段含义与设备端接入示例见仓库 `docs/推送协议.md`（同一份协议文档）。
            - **CPU 实时主频**（Windows）：主频改为显示 **PDH `Actual Frequency` 的实时值**
              （如 2232~3542 MHz 随负载变化）；此前显示的 sysinfo 频率在 Windows 上只是标称值
              （本机恒为 2300 MHz，跑满也不动）。实时值读不到时不装：卡片标签如实写明
              「**基准主频**」并把标称值摆在那里，不拿标称冒充实时。
            - **修复**：设置页里带开关的行会因隐藏控件把页面撑高，点开关后页面滚动位置卡死
              （表现为设置页「上窜」且滚不回来），本版已修。

            读取 CPU 温度最准的 MSR（Intel）/ SMN（AMD）通道与联想风扇转速（仅 Windows）需要管理员桥接（PawnIO 驱动，随包分发、绝不静默安装），
            入口在设置页「高级采集」；不启用也能正常使用，温度会回退到 ACPI / PDH 通道。
          releaseDraft: false
          prerelease: false

  release-linux:
    name: Linux 打包并上传
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri 系统依赖（webkit2gtk 4.1 等；libfuse2 供 AppImage 打包工具运行，libdbus-1-dev 供 BLE 推送通道的 bluer 编译）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 libdbus-1-dev

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 与 Windows job 同一理由：出包前再跑一遍单测（Linux 路径在真机 hwmon / procfs 上执行）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # 打包目标来自 tauri.linux.conf.json（deb + AppImage）；
      # Release 已由 Windows job 创建，这里只往同一个 Release 追加产物
      - name: 构建 deb / AppImage 并上传 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
