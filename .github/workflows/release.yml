# Release：推送 v* 标签时打包 Windows NSIS 安装包 + Linux deb/AppImage，
# 并自动创建 GitHub Release
#
# 用法：
#   1. 同步版本号（package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml，
#      workflow 会校验 tag 与 tauri.conf.json 一致，不一致直接失败）
#   2. git tag v0.x.y && git push origin v0.x.y
#
# 安装包文件名里的版本号来自 tauri.conf.json 的 version 字段。
# 打包目标按平台拆在 tauri.windows.conf.json（nsis + PawnIO 资源）与
# tauri.linux.conf.json（deb + AppImage，不带 Windows 专属资源）里。
# Linux job 依赖 Windows job（needs）：版本校验在 Windows job 里先跑，
# 也避免两个 job 并发创建同一个 Release 互相竞争。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows 打包并发布
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable, msvc）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22（Vite 7 要求 ≥ 20.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 与 CI 一致：npm ci + package-lock.json，保证打版用的依赖树可复现
      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($conf -ne $tag) {
            Write-Error "tag (v$tag) 与 tauri.conf.json 的 version ($conf) 不一致，请先同步版本号再打标签"
          }

      # 出正式包之前再跑一遍单测，防止带着回归打版（Cargo.toml 在 src-tauri/ 下）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # tauri-action 会执行 tauri build（含 beforeBuildCommand），出 NSIS 安装包
      # 并上传到 GitHub Release，不会走裸 cargo build
      - name: 构建 NSIS 安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 安装包（NSIS）：下载 `PulseDeck_0.11.0_x64-setup.exe` 双击安装即可，
            无需联网、无需管理员权限。

            Linux x64：deb 系发行版（Debian / Ubuntu / Deepin / UOS）下载 `PulseDeck_0.11.0_amd64.deb`，
            执行 `sudo apt install ./PulseDeck_0.11.0_amd64.deb`；其他发行版下载
            `PulseDeck_0.11.0_amd64.AppImage`，`chmod +x` 后直接运行。
            Linux 上无需提权（温度 / 风扇走 hwmon）。

            ## 本版更新（${{ github.ref_name }}）

            ### 桌面宠物：打字猫（KuroCat 移植）

            宠物新增「打字猫」形象（默认），移植自 KuroCat（MIT）：敲键盘 / 按鼠标 / 摸猫头都有反应，
            同屏继续显示 CPU / 内存 / GPU 与温度；原来的 6 档贴图保留为「经典贴图」，可随时切回。

            - 2D 手绘与 3D 手办双引擎（3D 需 WebGL2，不可用时自动回退 2D）
            - 6 款猫皮肤 + 鲸鱼娘（仅 2D），65% / 108 键、面向猫咪 / 面向观众双视角
            - 全局键鼠反应、摸头眯眼与呼噜声、密码框自动闭眼防窥（均仅 Windows；
              Linux 上猫与指标正常，只是没有键鼠反应）
            - 尺寸 20%–150%，窗口右下角锚定；锁定鼠标穿透 + 按住 Alt 临时操作
            - CPU 温度驱动光晕，≥84°C 出现脸红与汗滴；窄窗指标条自动切 2×2 紧凑排版
            - 安装包内附带 KuroCat / dsh-pet 的 MIT 许可文本

            ### 移动端预览：深空仪表样式与迷你折线

            桌面端「编辑布局」里的手机 / 平板预览同步 App 的深空仪表视觉（深色面板、顶部类型色条、
            等宽数字），趋势与网络卡改画与 App 同源的迷你折线。

            ### 其它

            - 移动端布局：流式与固定一屏双布局（此前未推送的改动一并发布）
            - 桌面宠物尺寸范围恢复为 20%–150%（窄窗指标条自动 2×2）

            读取 CPU 温度最准的 MSR（Intel）/ SMN（AMD）通道与联想风扇转速（仅 Windows）需要管理员桥接（PawnIO 驱动，随包分发、绝不静默安装），
            入口在设置页「高级采集」；不启用也能正常使用，温度会回退到 ACPI / PDH 通道。
          releaseDraft: false
          prerelease: false

  release-linux:
    name: Linux 打包并上传
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri 系统依赖（webkit2gtk 4.1 等；libfuse2 供 AppImage 打包工具运行，libdbus-1-dev 供 BLE 推送通道的 bluer 编译）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 libdbus-1-dev

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 与 Windows job 同一理由：出包前再跑一遍单测（Linux 路径在真机 hwmon / procfs 上执行）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # 打包目标来自 tauri.linux.conf.json（deb + AppImage）；
      # Release 已由 Windows job 创建，这里只往同一个 Release 追加产物
      - name: 构建 deb / AppImage 并上传 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ubuntu 24.04 的系统库带 .relr.dyn 段，linuxdeploy 自带的 strip 不认
          # （unknown type [0x13] section .relr.dyn），会以 "failed to run linuxdeploy" 失败；
          # 关闭 strip 即可，代价是 AppImage 略大（0.10.0 的 90MB 也是这个量级）。
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
