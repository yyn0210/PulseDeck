# Release：推送 v* 标签时打包 Windows NSIS 安装包 + Linux deb/AppImage，
# 并自动创建 GitHub Release
#
# 用法：
#   1. 同步版本号（package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml，
#      workflow 会校验 tag 与 tauri.conf.json 一致，不一致直接失败）
#   2. git tag v0.x.y && git push origin v0.x.y
#
# 安装包文件名里的版本号来自 tauri.conf.json 的 version 字段。
# 打包目标按平台拆在 tauri.windows.conf.json（nsis + PawnIO 资源）与
# tauri.linux.conf.json（deb + AppImage，不带 Windows 专属资源）里。
# Linux job 依赖 Windows job（needs）：版本校验在 Windows job 里先跑，
# 也避免两个 job 并发创建同一个 Release 互相竞争。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows 打包并发布
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable, msvc）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22（Vite 7 要求 ≥ 20.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 与 CI 一致：npm ci + package-lock.json，保证打版用的依赖树可复现
      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($conf -ne $tag) {
            Write-Error "tag (v$tag) 与 tauri.conf.json 的 version ($conf) 不一致，请先同步版本号再打标签"
          }

      # 出正式包之前再跑一遍单测，防止带着回归打版（Cargo.toml 在 src-tauri/ 下）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # tauri-action 会执行 tauri build（含 beforeBuildCommand），出 NSIS 安装包
      # 并上传到 GitHub Release，不会走裸 cargo build
      - name: 构建 NSIS 安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 安装包（NSIS）：下载 `PulseDeck_0.7.0_x64-setup.exe` 双击安装即可，
            无需联网、无需管理员权限。

            Linux x64：deb 系发行版（Debian / Ubuntu / Deepin / UOS）下载 `PulseDeck_0.7.0_amd64.deb`，
            执行 `sudo apt install ./PulseDeck_0.7.0_amd64.deb`；其他发行版下载
            `PulseDeck_0.7.0_amd64.AppImage`，`chmod +x` 后直接运行。
            Linux 上无需提权（温度 / 风扇走 hwmon）。

            ## 本版更新（${{ github.ref_name }}）

            本版是 GPU 采集的一次重构：**从「只报一块卡」变成「有多少块报多少块」**。

            - **多显卡机器上不再只显示一块卡**：以前 NVIDIA 显卡可用时就只报 NVML 那一份，笔记本的
              Intel 核显、多卡机器的第二块显卡都不出现；现在 NVML 与通用计数器（Windows 性能计数器 /
              Linux 显卡驱动 sysfs）**同时采样、合并展示** —— 概览大数字仍取一块主卡，其余显卡在
              GPU 卡片里单列「其它显卡」一行（名字 + 占用），只有一块卡时该行不出现。
            - **主卡选取改为「驱动直读优先，其次占用最高」**（Windows / Linux 同规则）：只按占用挑的话，
              笔记本核显常年被桌面合成占着几个百分点，插着独显的机器主卡会一直在核显与独显之间跳；
              现在主卡稳定落在独显上，且卡片上显示的型号与数字保证是同一块卡（不再拿列表第一块充数）。
            - **Windows 端显卡身份改用 DXGI 枚举**（新增 `gpu_dxgi.rs`）：名字 / 厂商 / 显存总量向 DXGI 要，
              并按 LUID 与性能计数器实例**精确对上** —— 旧版按「计数器实例顺序 == WMI 显卡列表顺序」猜名字，
              两者毫无关系，多显卡机器上必然张冠李戴（那条 WMI 查询已删除）。DXGI 对同一块物理卡重复枚举、
              软件适配器（WARP）等情形均已处理。
            - **核显的显存口径改为「专用 + 共享」**（与任务管理器的「GPU 内存」一致）：Intel 核显的专用段
              只是个固定的小 carve-out，单看它会读出「128 MiB 里塞了 300 MiB」这类荒谬值；独显仍只报专用段，
              与 NVML 口径保持一致。
            - **Linux 端新增 Intel 显卡（i915 / xe）**：经 hwmon 读取温度 / 功耗 / 风扇（Intel 显卡的 hwmon
              只有能量计数器、没有平均功率接口，功耗由两拍差分求得）。Intel 没有占用与显存的 sysfs 接口，
              这两项如实显示 `--` —— 不拿频率冒充占用。
            - 「GPU 风扇读不到」的提示文案补充了原因：**Windows 没有面向 AMD / Intel 显卡的公开风扇接口**，
              核显本身也不带风扇。

            > 说明：**Windows 上没有面向 AMD / Intel 显卡的公开温度与功耗接口**（NVML 是 NVIDIA 专属，
            > 性能计数器没有温度），这几项如实显示 `--`，装 OpenHardwareMonitor 之类可回填一个汇总温度；
            > Linux 端 A 卡（amdgpu sysfs）与 N 卡（NVML）的指标不受影响，照旧齐全。

            读取 CPU 温度最准的 MSR（Intel）/ SMN（AMD）通道与联想风扇转速（仅 Windows）需要管理员桥接（PawnIO 驱动，随包分发、绝不静默安装），
            入口在设置页「高级采集」；不启用也能正常使用，温度会回退到 ACPI / PDH 通道。
          releaseDraft: false
          prerelease: false

  release-linux:
    name: Linux 打包并上传
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri 系统依赖（webkit2gtk 4.1 等；libfuse2 供 AppImage 打包工具运行）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 与 Windows job 同一理由：出包前再跑一遍单测（Linux 路径在真机 hwmon / procfs 上执行）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # 打包目标来自 tauri.linux.conf.json（deb + AppImage）；
      # Release 已由 Windows job 创建，这里只往同一个 Release 追加产物
      - name: 构建 deb / AppImage 并上传 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
