# Release：推送 v* 标签时打包 Windows NSIS 安装包 + Linux deb/AppImage，
# 并自动创建 GitHub Release
#
# 用法：
#   1. 同步版本号（package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml，
#      workflow 会校验 tag 与 tauri.conf.json 一致，不一致直接失败）
#   2. git tag v0.x.y && git push origin v0.x.y
#
# 安装包文件名里的版本号来自 tauri.conf.json 的 version 字段。
# 打包目标按平台拆在 tauri.windows.conf.json（nsis + PawnIO 资源）与
# tauri.linux.conf.json（deb + AppImage，不带 Windows 专属资源）里。
# Linux job 依赖 Windows job（needs）：版本校验在 Windows job 里先跑，
# 也避免两个 job 并发创建同一个 Release 互相竞争。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows 打包并发布
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable, msvc）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22（Vite 7 要求 ≥ 20.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 与 CI 一致：npm ci + package-lock.json，保证打版用的依赖树可复现
      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($conf -ne $tag) {
            Write-Error "tag (v$tag) 与 tauri.conf.json 的 version ($conf) 不一致，请先同步版本号再打标签"
          }

      # 出正式包之前再跑一遍单测，防止带着回归打版（Cargo.toml 在 src-tauri/ 下）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # tauri-action 会执行 tauri build（含 beforeBuildCommand），出 NSIS 安装包
      # 并上传到 GitHub Release，不会走裸 cargo build
      - name: 构建 NSIS 安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 安装包（NSIS）：下载 `PulseDeck_0.5.0_x64-setup.exe` 双击安装即可，
            无需联网、无需管理员权限。

            Linux x64：deb 系发行版（Debian / Ubuntu / Deepin / UOS）下载 `PulseDeck_0.5.0_amd64.deb`，
            执行 `sudo apt install ./PulseDeck_0.5.0_amd64.deb`；其他发行版下载
            `PulseDeck_0.5.0_amd64.AppImage`，`chmod +x` 后直接运行。
            Linux 上无需提权（温度 / 风扇走 hwmon）。

            ## 本版更新（${{ github.ref_name }}）

            - **大幅降低采样开销**：进程榜只刷新界面真正用到的「占用率 + 内存」——不再把每个线程
              当成独立进程逐个读取（Linux 上 425 个进程曾被展开成 3177 条逐条读 stat / statm），
              也不再读每个进程的磁盘 IO 与可执行路径。实测单拍采样耗时：本机 Windows 从 76 ms
              降到 39 ms（其中进程刷新 52 ms → 21 ms）；Linux 桌面机从 70 ms 降到 10 ms 量级，
              常驻的进程条目与打开的系统文件数降到约 1/7。
            - **Linux 温度采集只读用得上的芯片**：CPU / 显卡之外的 hwmon（NVMe、无线网卡、电池…）
              不再逐个读温度——NVMe 一次读要往设备发一条 admin 命令、光它一个芯片就 9 ms，
              比其余芯片加起来还贵；整次 hwmon 扫描从 10 ms 降到 1 ms。
            - **主面板重绘开销压到接近零**：核心条形图的长度改用不触发页面重排的合成变换绘制
              （顺带去掉它的补间），环形进度只在读数明显跳变（≥ 8 个百分点）时才补间——实测把
              「每秒一拍」的界面重绘开销从约一个 CPU 核的 15%（环形补间 11% + 核心条 4%，
              另有同量级的主进程合成开销）收掉，长时间开着更省电。

            读取 CPU 温度最准的 MSR 通道与联想风扇转速（仅 Windows）需要管理员桥接（PawnIO 驱动，随包分发、绝不静默安装），
            入口在设置页「高级采集」；不启用也能正常使用，温度会回退到 ACPI / PDH 通道。
          releaseDraft: false
          prerelease: false

  release-linux:
    name: Linux 打包并上传
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri 系统依赖（webkit2gtk 4.1 等；libfuse2 供 AppImage 打包工具运行）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 与 Windows job 同一理由：出包前再跑一遍单测（Linux 路径在真机 hwmon / procfs 上执行）
      - name: 发布前 Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      # 打包目标来自 tauri.linux.conf.json（deb + AppImage）；
      # Release 已由 Windows job 创建，这里只往同一个 Release 追加产物
      - name: 构建 deb / AppImage 并上传 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '脉盘 PulseDeck ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
