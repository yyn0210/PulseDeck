# CI：push / PR 到 main 时跑 Rust 单测 + 走 tauri CLI 构建校验，并挂出 exe 供手动下载
#
# Windows job 是发布目标（x86_64-pc-windows-msvc）；构建一律走 `npm run build:exe`
# （tauri CLI 会追加 custom-protocol feature），绝不能在 CI 里裸 `cargo build --release`
# （会产出请求 devUrl 的白屏 exe）。
#
# Ubuntu job 跑完整 `cargo test`：指标读取已按 platform/ trait 抽象 + 全 crate
# cfg(windows) 分区（2026-10-14），Linux 采集源（hwmon / sysfs / procfs）在 runner
# 真机上被实际执行；`cargo test` 编译 lib 时会加载并校验 tauri.linux.conf.json 的
# 合并结果。打包（deb / AppImage）只在 Release workflow 里做。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: 测试 + 构建校验
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable, msvc）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22（Vite 7 要求 ≥ 20.19）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 npm ci 而非 npm install：锁文件把依赖树钉死。
      # 教训：2026-10-13 那次 CI 挂在这里，npm error E404 rollup-4.64.6.tgz ——
      # 无锁文件时每次 install 都解析「当前最新版」，正好撞上 rollup 刚发布、
      # tarball 还没同步到 CDN 的那几分钟。锁文件同时让 setup-node 的缓存可用。
      - name: 安装前端依赖
        run: npm ci

      # Cargo.toml 在 src-tauri/ 下，仓库根没有 workspace 清单
      # diag/smoke 用例在无硬件环境按设计降级（缺 NVIDIA/电池/联想风扇时只打印不断言）
      - name: Rust 单测
        working-directory: src-tauri
        run: cargo test -p pulse-deck

      - name: 构建校验（tauri build --no-bundle）
        run: npm run build:exe

      - name: 上传 exe 供手动取用
        uses: actions/upload-artifact@v4
        with:
          name: pulse-deck-windows-x64
          path: src-tauri/target/release/pulse-deck.exe
          retention-days: 7
          if-no-files-found: error

  # 跨平台守护：Linux 上完整 crate（含 Tauri 依赖树）要能编译并跑通测试。
  # runner 真机有 hwmon / procfs / power_supply / drm，Linux 采集源会被**真实运行**
  # （无 GPU / 电池的机型按设计诚实降级）；pet / taskbar 的跨平台窗口代码
  # 也在这一步过编译（本机 Windows 无法验证非 Windows 分支）。
  # tauri 的 Linux 依赖需要系统库；vite build 产出 dist/ 是 generate_context! 的
  # 编译期输入（frontendDist 必须存在），所以前端也要构建。
  ubuntu-test:
    name: 跨平台编译 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri 系统依赖（webkit2gtk 4.1 等；libdbus-1-dev 供 BLE 推送通道的 bluer 编译）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: 缓存 Cargo（注册表 + target）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖并构建 dist/
        run: |
          npm ci
          npx vite build

      - name: cargo test（非 Windows 路径）
        working-directory: src-tauri
        run: cargo test -p pulse-deck
